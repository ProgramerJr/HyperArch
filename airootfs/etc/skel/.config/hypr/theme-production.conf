# HyperArch — tema "Production"
# Se activa automáticamente al abrir apps de trabajo (FR-32) o con SUPER+P.
# Objetivo medible (FR-35): menor uso de GPU que el tema decorativo.

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(2f9bffff)
    col.inactive_border = rgba(2a2224ff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = false     # el mayor ahorro de GPU está aquí
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = instant, 0.1, 1, 0.1, 1
    animation = windows,    1, 1.5, instant
    animation = windowsOut, 1, 1,   instant
    animation = fade,       1, 1,   instant
    animation = workspaces, 1, 1.5, instant
    animation = border,     1, 1,   instant
    animation = layers,     0
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}
