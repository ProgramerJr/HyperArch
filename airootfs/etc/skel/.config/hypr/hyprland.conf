#  ██╗  ██╗██╗   ██╗██████╗ ███████╗██████╗
#  ██║  ██║╚██╗ ██╔╝██╔══██╗██╔════╝██╔══██╗
#  ███████║ ╚████╔╝ ██████╔╝█████╗  ██████╔╝
#  ██╔══██║  ╚██╔╝  ██╔═══╝ ██╔══╝  ██╔══██╗
#  ██║  ██║   ██║   ██║     ███████╗██║  ██║
#  HyperArch — Hyprland

source = ~/.config/hypr/theme.conf

# ─── Monitores ────────────────────────────────────────────────────────────
# Principal 27" 144 Hz horizontal, secundario 24" 60 Hz vertical.
monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = DP-2, 1920x1080@60, 2560x0, 1, transform, 1
monitor = , preferred, auto, 1

# ─── Entrada ──────────────────────────────────────────────────────────────
input {
    kb_layout = es
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
}

# ─── Arranque ─────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = hyper-production-watch

# ─── Reglas de ventana ────────────────────────────────────────────────────
# Apps de trabajo: sin cristal, opacidad total, workspace fijo (FR-32).
windowrulev2 = opaque,     class:^(code|code-url-handler|Code)$
windowrulev2 = noblur,     class:^(code|code-url-handler|Code)$
windowrulev2 = workspace 2,class:^(code|code-url-handler|Code)$

windowrulev2 = opaque,     class:^(MongoDB Compass|Postman)$
windowrulev2 = noblur,     class:^(MongoDB Compass|Postman)$
windowrulev2 = workspace 4,class:^(MongoDB Compass|Postman)$

windowrulev2 = workspace 3, class:^(brave-browser|Chromium)$
windowrulev2 = workspace 9, class:^(steam)$
windowrulev2 = opaque,      class:^(steam)$
windowrulev2 = workspace 4, class:^(virt-manager)$

# Flotantes
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor)$
windowrulev2 = float, title:^(Hyper Hub)$
windowrulev2 = size 1100 720, title:^(Hyper Hub)$
windowrulev2 = center, title:^(Hyper Hub)$

# ─── Atajos ───────────────────────────────────────────────────────────────
# Semántica de niveles:
#   SUPER        → lanzar/enfocar
#   SUPER+SHIFT  → variante secundaria
#   SUPER+ALT    → geometría y sistema
$mod = SUPER

# Desarrollo
bind = $mod, RETURN, exec, kitty
bind = $mod, R, exec, code --profile Web-React
bind = $mod, J, exec, code --profile Java
bind = $mod, O, exec, code --profile DevOps
bind = $mod, G, exec, kitty --class lazygit -e lazygit
bind = $mod, D, exec, kitty --class lazydocker -e lazydocker
bind = $mod SHIFT, D, exec, mongodb-compass
bind = $mod, A, exec, postman

# Sistema y monitorización
bind = $mod, H, exec, hyper-hub
bind = $mod, M, exec, kitty --class btop -e btop
bind = $mod SHIFT, M, exec, kitty --class nvtop -e nvtop
bind = $mod, I, exec, hyper-hub --panel ai

# Modos
bind = $mod, P, exec, hyper-production-mode toggle
bind = $mod, Z, exec, hyper-focus-mode toggle
bind = $mod SHIFT, W, exec, hyper-wallpaper toggle

# General
bind = $mod, SPACE, exec, wofi --show drun
bind = $mod, E, exec, thunar
bind = $mod, B, exec, brave
bind = $mod SHIFT, B, exec, chromium --incognito --user-data-dir=/tmp/clean-browser
bind = $mod, S, exec, steam
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, Q, killactive
bind = $mod, F, fullscreen

# Ventanas
bind = $mod ALT, F, togglefloating
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod ALT, left,  resizeactive, -60 0
bind = $mod ALT, right, resizeactive,  60 0
bind = $mod ALT, up,    resizeactive, 0 -60
bind = $mod ALT, down,  resizeactive, 0  60
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspaces (1 terminal · 2 editor · 3 navegador · 4 datos · 5 monitor · 9 juegos)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 9, movetoworkspace, 9

# Multimedia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
