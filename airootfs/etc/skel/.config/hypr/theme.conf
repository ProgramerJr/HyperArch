# HyperArch — tema "Crystal"
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(2f9bffee) rgba(6d3cffee) rgba(2f9bffee) 45deg
    col.inactive_border = rgba(141822aa)
    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 16
    active_opacity = 0.88
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.12
    dim_special = 0.35

    blur {
        enabled = true
        size = 9
        passes = 4
        new_optimizations = true
        xray = true
        vibrancy = 0.32
        vibrancy_darkness = 0.12
        contrast = 1.15
        brightness = 0.92
        noise = 0.012
        popups = true
        popups_ignorealpha = 0.4
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 6
        color = rgba(2f9bff40)
        color_inactive = rgba(00000055)
        scale = 0.97
    }
}

animations {
    enabled = true
    bezier = crystal,   0.16, 1,    0.3,  1
    bezier = snappy,    0.05, 0.9,  0.1,  1
    bezier = overshoot, 0.34, 1.56, 0.64, 1
    bezier = gentle,    0.25, 0.1,  0.25, 1

    animation = windowsIn,   1, 4,   overshoot, popin 88%
    animation = windowsOut,  1, 3,   snappy,    popin 92%
    animation = windowsMove, 1, 3.5, crystal
    animation = fadeIn,      1, 3,   gentle
    animation = fadeOut,     1, 2.5, gentle
    animation = fadeSwitch,  1, 3,   gentle
    animation = fadeDim,     1, 4,   gentle
    animation = workspaces,  1, 4.5, crystal, slidefadevert 18%
    animation = specialWorkspace, 1, 4, crystal, slidevert
    animation = border,      1, 12,  default
    animation = borderangle, 1, 180, gentle, loop
    animation = layers,      1, 3,   snappy, slide
    animation = layersIn,    1, 3.5, overshoot, slide
    animation = layersOut,   1, 2.5, snappy, slide
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    special_scale_factor = 0.94
}

master { new_status = master }

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    focus_on_activate = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    background_color = 0x090909
}
