# HyperArch — tema "Crimson Glass"
# Fichero separado a propósito: hyper-production-mode lo intercambia en caliente.

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(2f9bffcc) rgba(6d3cffcc) 45deg
    col.inactive_border = rgba(141822aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 14
    active_opacity = 0.82
    inactive_opacity = 0.68
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        xray = true
        vibrancy = 0.25
        contrast = 1.1
        noise = 0.015
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(2f9bff55)
        color_inactive = rgba(00000066)
    }
}

animations {
    enabled = true
    # Curvas afinadas para 144 Hz: cortas y con overshoot mínimo.
    bezier = crimson,  0.16, 1, 0.3, 1
    bezier = snappy,   0.05, 0.9, 0.1, 1
    animation = windows,     1, 3.5, crimson, slide
    animation = windowsOut,  1, 3,   snappy,  slide
    animation = fade,        1, 3,   snappy
    animation = workspaces,  1, 4,   crimson, slidevert
    animation = border,      1, 6,   crimson
    animation = layers,      1, 3,   snappy, fade
}

dwindle {
    preserve_split = true
    smart_split = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    focus_on_activate = true
}
