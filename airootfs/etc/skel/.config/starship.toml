format = """
[](#6d3cff)\
$os$username\
[](bg:#16233d fg:#6d3cff)\
$directory\
[](fg:#16233d bg:#141822)\
$git_branch$git_status\
[](fg:#141822 bg:#0d0f14)\
$nodejs$java$rust$docker_context\
[](fg:#0d0f14)\
$line_break$character"""

[os]
disabled = false
style = "bg:#6d3cff fg:#d6e4f3"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"

[username]
show_always = true
style_user = "bg:#6d3cff fg:#d6e4f3"
format = "[ $user ]($style)"

[directory]
style = "bg:#16233d fg:#d6e4f3"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#141822 fg:#2f9bff"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#141822 fg:#fbbf24"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
symbol = "󰎙"
style = "bg:#0d0f14 fg:#4ade80"
format = "[ $symbol $version ]($style)"

[java]
symbol = ""
style = "bg:#0d0f14 fg:#f89820"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:#0d0f14 fg:#ff8a3c"
format = "[ $symbol $version ]($style)"

[docker_context]
symbol = "󰡨"
style = "bg:#0d0f14 fg:#2496ed"
format = "[ $symbol $context ]($style)"

[character]
success_symbol = "[❯](bold #2f9bff)"
error_symbol = "[❯](bold #ff3b5c)"
