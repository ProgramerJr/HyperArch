format = """
[](#8b0020)\
$os$username\
[](bg:#3a1018 fg:#8b0020)\
$directory\
[](fg:#3a1018 bg:#1a1416)\
$git_branch$git_status\
[](fg:#1a1416 bg:#0f0d0e)\
$nodejs$java$rust$docker_context\
[](fg:#0f0d0e)\
$line_break$character"""

[os]
disabled = false
style = "bg:#8b0020 fg:#f3d6d9"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"

[username]
show_always = true
style_user = "bg:#8b0020 fg:#f3d6d9"
format = "[ $user ]($style)"

[directory]
style = "bg:#3a1018 fg:#f3d6d9"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#1a1416 fg:#ff1e3c"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#1a1416 fg:#fbbf24"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
symbol = "󰎙"
style = "bg:#0f0d0e fg:#4ade80"
format = "[ $symbol $version ]($style)"

[java]
symbol = ""
style = "bg:#0f0d0e fg:#f89820"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:#0f0d0e fg:#ff1e3c"
format = "[ $symbol $version ]($style)"

[docker_context]
symbol = "󰡨"
style = "bg:#0f0d0e fg:#2496ed"
format = "[ $symbol $context ]($style)"

[character]
success_symbol = "[❯](bold #ff1e3c)"
error_symbol = "[❯](bold #8b0020)"
