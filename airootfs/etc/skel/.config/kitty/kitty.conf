# HyperArch — Crimson Glass
font_family      JetBrainsMono Nerd Font
font_size        11.5
bold_font        auto
italic_font      auto

background            #090909
foreground            #f3d6d9
cursor                #ff1e3c
selection_background  #8b0020
selection_foreground  #f3d6d9

background_opacity    0.85
background_blur       32
dynamic_background_opacity yes

window_padding_width  10
hide_window_decorations yes
confirm_os_window_close 0

