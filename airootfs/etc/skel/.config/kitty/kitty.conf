color11 #fcd34d
color4 #60a5fa
color12 #93c5fd
color5 #c084fc
color13 #d8b4fe
color6 #22d3ee
color14 #67e8f9
color7 #f3d6d9
color15 #ffffff

scrollback_lines 20000
enable_audio_bell no
