# HyperArch — vigilancia de discos.
# Con historial de apagones inesperados, saber que un NVMe empieza a fallar
# antes de que falle del todo vale más que cualquier optimización.
DEVICESCAN -a -o on -S on \
  -s (S/../.././02|L/../../6/03) \
  -W 4,45,60 \
  -m root -M exec /usr/local/bin/hyper-disk-alert
